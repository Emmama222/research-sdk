# Planning clearance added to (robot radius + obstacle radius) by every planner,
# in millimetres. Set a per-planner value to override the shared one; leave a
# per-planner value empty to fall back to planning_clearance_mm.
# Effective margin = robot radius + this value. Voronoi's roadmap generator
# already enforces VORONOI_MIN_CLEARANCE_MM = ROBOT_RADIUS_MM + SAFE_MARGIN
# (90 + 30 = 120 mm) for its corridors, so a global clearance stacks on top of a
# requirement the other two planners do not have and closes the corridors it
# needs. Per-planner values below equalise EFFECTIVE margin at 120 mm.
planning_clearance_mm: 0.0
voronoi_clearance_mm: 0.0
prm_clearance_mm: 30.0
visibility_clearance_mm: 30.0

# Voronoi path-planning defaults.
voronoi_boundary_inset_mm: 100.0
voronoi_density_percent: 10.0
voronoi_max_density_nodes: 100
voronoi_render_density_percent: 10.0
voronoi_render_max_density_nodes: 80
voronoi_obstacle_cost_weight: 2.0
voronoi_horizon_ms: 250
voronoi_target_dead_zone_mm: 150.0
voronoi_connection_count: 8
voronoi_connection_radius_mm: 2200.0
voronoi_endpoint_reach_mm: 70.0
voronoi_escape_margin_mm: 120.0
voronoi_min_escape_step_mm: 250.0

# Visibility Graph path-planning defaults.
visibility_polygon_sides: 6

# PRM path-planning defaults.
prm_num_samples: 20
prm_k_neighbours: 6
prm_max_resample_attempts: 5

