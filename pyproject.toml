[project]
name = "research-sdk"
version = "0.1.0"
description = "SDK for evaluating and quickly deploying legacy code behind pluggable adaptors, with results exportable and select capabilities exposed to agents over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.7",
    "pydantic>=2.0",
    "mcp>=2.0",
    "protobuf>=5.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=16.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "grpcio-tools>=1.60"]

[project.scripts]
research-sdk-ui = "research_sdk.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_sdk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
